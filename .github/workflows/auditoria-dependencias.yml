name: Auditoria de dependências 1.2.5

on:
  push:
    branches:
      - audit/dependencias-seguranca-licencas
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-maven:
    name: Testes Maven (Java 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Instalar Xvfb para testes JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Registrar ambiente
        run: |
          java -version 2>&1 | tee java-version.txt
          mvn --version 2>&1 | tee maven-version.txt

      - name: Executar clean test
        run: xvfb-run --auto-servernum mvn --batch-mode --no-transfer-progress clean test

      - name: Executar clean verify
        run: xvfb-run --auto-servernum mvn --batch-mode --no-transfer-progress clean verify

  auditoria-dependencias:
    name: Árvore, CVEs e licenças
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Restaurar cache do banco OWASP Dependency-Check
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-v12-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-v12-${{ runner.os }}-

      - name: Criar pasta de evidências
        run: mkdir -p audit-results

      - name: Registrar ambiente e data UTC
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" | tee audit-results/data-utc.txt
          java -version 2>&1 | tee audit-results/java-version.txt
          mvn --version 2>&1 | tee audit-results/maven-version.txt

      - name: Árvore completa de dependências
        run: mvn --batch-mode --no-transfer-progress dependency:tree -Dverbose -DoutputFile=audit-results/dependency-tree-all.txt

      - name: Árvore de dependências runtime
        run: mvn --batch-mode --no-transfer-progress dependency:tree -Dverbose -Dscope=runtime -DoutputFile=audit-results/dependency-tree-runtime.txt

      - name: Scanner OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SONATYPE_GUIDE_PAT: ${{ secrets.SONATYPE_GUIDE_PAT }}
        run: |
          if [ -z "$SONATYPE_GUIDE_PAT" ]; then
            echo "::error::Configure o segredo SONATYPE_GUIDE_PAT com um Personal Access Token do Sonatype Guide para autenticar o OSS Index."
            exit 2
          fi
          set +e
          result=1
          for attempt in 1 2 3; do
            echo "Execução do Dependency-Check: tentativa $attempt de 3"
            mvn --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:12.2.2:check -DnvdApiKey="$NVD_API_KEY" -DossIndexAnalyzerUrl=https://api.guide.sonatype.com -DossIndexPassword="$SONATYPE_GUIDE_PAT" -Dformat=ALL -Dodc.outputDirectory=target -DfailBuildOnCVSS=11 2>&1 | tee "audit-results/dependency-check-attempt-$attempt.log"
            result=${PIPESTATUS[0]}
            printf '%s\n' "$result" > "audit-results/dependency-check-attempt-$attempt-exit-code.txt"
            if [ "$result" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Scanner falhou com código $result; nova tentativa em $wait_seconds segundos."
              sleep "$wait_seconds"
            fi
          done
          printf '%s\n' "$result" | tee audit-results/dependency-check-exit-code.txt
          report_count=0
          for report in target/dependency-check-report.*; do
            [ -f "$report" ] || continue
            cp "$report" audit-results/
            report_count=$((report_count + 1))
          done
          if [ "$result" -eq 0 ]; then
            for required_report in audit-results/dependency-check-report.html audit-results/dependency-check-report.json audit-results/dependency-check-report.xml; do
              if [ ! -s "$required_report" ]; then
                echo "::error::Relatório obrigatório ausente ou vazio: $required_report"
                result=3
              fi
            done
          fi
          printf '%s\\n' "$result" | tee audit-results/dependency-check-exit-code.txt
          if [ "$report_count" -eq 0 ]; then
            echo "::error::Nenhum relatório do Dependency-Check foi encontrado em target/dependency-check-report.*."
            result=3
            printf '%s\\n' "$result" | tee audit-results/dependency-check-exit-code.txt
          fi
          exit "$result"

      - name: Relatório de licenças transitivas
        id: license_report
        continue-on-error: true
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress org.codehaus.mojo:license-maven-plugin:2.7.1:aggregate-third-party-report -Dlicense.outputDirectory=audit-results/licenses
          result=$?
          printf '%s\n' "$result" | tee audit-results/license-report-exit-code.txt
          mkdir -p audit-results/licenses
          for path in target/generated-sources/license target/site; do
            if [ -d "$path" ]; then cp -a "$path"/. audit-results/licenses/; fi
          done
          exit "$result"

      - name: Publicar evidências da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-1.2.5
          path: audit-results/
          if-no-files-found: error
          retention-days: 30

      - name: Exigir conclusão válida dos relatórios
        if: always()
        env:
          DEPENDENCY_CHECK_OUTCOME: ${{ steps.dependency_check.outcome }}
          LICENSE_REPORT_OUTCOME: ${{ steps.license_report.outcome }}
        run: |
          failed=0
          if [ "$DEPENDENCY_CHECK_OUTCOME" != "success" ]; then
            echo "::error::Dependency-Check não concluiu com sucesso após as tentativas. A auditoria de vulnerabilidades é inconclusiva."
            failed=1
          fi
          if [ "$LICENSE_REPORT_OUTCOME" != "success" ]; then
            echo "::error::A geração do relatório de licenças transitivas falhou."
            failed=1
          fi
          exit "$failed"

  inventario-empacotamento-windows:
    name: Inventário do empacotamento Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 22 e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Registrar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit-results | Out-Null
          Get-Date -AsUTC -Format o | Set-Content audit-results/data-utc.txt
          java -version 2>&1 | Out-File audit-results/java-version.txt
          mvn --version 2>&1 | Out-File audit-results/maven-version.txt
          Get-Command jlink,jpackage | Format-List * | Out-File audit-results/jdk-packaging-tools.txt

      - name: Executar empacotamento oficial
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & .\\scripts\\build-installer.ps1 *>&1 | Tee-Object -FilePath audit-results\\installer-build.log
          $code = $LASTEXITCODE
          "script_exit_code=$code" | Add-Content audit-results\\installer-build-status.txt
          if (Test-Path "dist\\GeradorDesignacoes-1.2.5\\app") {
            Get-ChildItem "dist\\GeradorDesignacoes-1.2.5\\app" -File -Recurse |
              Select-Object FullName,Length |
              Export-Csv -NoTypeInformation -Encoding utf8 audit-results\\runtime-jars.csv
          }
          if (Test-Path "dist\\GeradorDesignacoes-1.2.5\\runtime\\legal") {
            Get-ChildItem "dist\\GeradorDesignacoes-1.2.5\\runtime\\legal" -File -Recurse |
              Select-Object FullName,Length |
              Export-Csv -NoTypeInformation -Encoding utf8 audit-results\\jdk-legal-files.csv
          }
          if (Test-Path "Instalador\\GeradorDesignacoes-1.2.5.exe") {
            Get-Item "Instalador\\GeradorDesignacoes-1.2.5.exe" |
              Select-Object FullName,Length,LastWriteTimeUtc |
              Export-Csv -NoTypeInformation -Encoding utf8 audit-results\\installer-artifact.csv
            Get-FileHash "Instalador\\GeradorDesignacoes-1.2.5.exe" -Algorithm SHA256 |
              Format-List | Out-File audit-results\\installer-sha256.txt
          }
          if ($code -ne 0) { exit $code }

      - name: Publicar inventário e logs do empacotamento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-empacotamento-windows-1.2.5
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
